name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure environment configuration
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Signing Keystore
        env:
          SIGNING_KEY_DATA: ${{ secrets.PEGION_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY_DATA" ]; then
            echo "Decoding release keystore..."
            if echo "$SIGNING_KEY_DATA" | tr -d '\r\n ' | base64 -d > release.jks 2>/dev/null && [ -s release.jks ]; then
              echo "Decoded release keystore."
            elif echo "$SIGNING_KEY_DATA" | base64 -d > release.jks 2>/dev/null && [ -s release.jks ]; then
              echo "Decoded release keystore from multiline base64."
            else
              printf '%s' "$SIGNING_KEY_DATA" > release.jks
            fi
            echo "PEGION_KEYSTORE_FILE=${GITHUB_WORKSPACE}/release.jks" >> $GITHUB_ENV
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release & Debug APKs
        env:
          PEGION_KEYSTORE_FILE: ${{ env.PEGION_KEYSTORE_FILE || format('{0}/release.jks', github.workspace) }}
          PEGION_ALIAS: ${{ secrets.PEGION_ALIAS }}
          PEGION_PASSWORD: ${{ secrets.PEGION_PASSWORD }}
          PEGION_SIGNING_KEY_PASSWORD: ${{ secrets.PEGION_SIGNING_KEY_PASSWORD || secrets.PEGION_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename APKs for Release
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name || inputs.tag_name || 'latest' }}"
          # Find and copy release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "dist/pegion-${TAG}-release.apk"
          fi
          # Find and copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "dist/pegion-${TAG}-debug.apk"
          fi
          ls -la dist/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: Pegion ${{ github.ref_name || inputs.tag_name }}
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
